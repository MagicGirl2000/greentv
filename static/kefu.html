<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>绿太阳 · 在线客服</title>
<style>
*{box-sizing:border-box;font-family:"微软雅黑",system-ui,sans-serif}
body{margin:0;background:#FAFAFA}
.wrap{max-width:420px;margin:0 auto;height:100vh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 16px rgba(0,0,0,.08)}
.hd{background:#2E7D32;color:#fff;padding:12px 16px;font-weight:bold}
.hd small{font-weight:normal;opacity:.85;font-size:11px;display:block;margin-top:2px}
.thanks{background:#F3F0FF;color:#7B61FF;font-size:11px;text-align:center;padding:4px}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;max-width:88%}.row.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:bold}
.av.adam{background:#2E7D32}.av.me{background:#1565C0}.av.sys{background:#F57C00}
.bub{padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.row.adam .bub{background:#EDF7ED;color:#1b3a1b}.row.me .bub{background:#E3F0FC;color:#10314f}.row.sys .bub{background:#FFF3E0;color:#8a5a00}
.ipt{display:flex;gap:8px;padding:10px;border-top:1px solid #eee}
.ipt input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.ipt button{background:#2E7D32;color:#fff;border:0;border-radius:8px;padding:0 16px;font-weight:bold;cursor:pointer}
.form{padding:10px;border-top:1px solid #eee;display:none;flex-direction:column;gap:8px;background:#FFF8E1}
.form input,.form textarea{padding:9px;border:1px solid #ddd;border-radius:8px;font-size:14px;width:100%}
.form button{background:#F57C00;color:#fff;border:0;border-radius:8px;padding:10px;font-weight:bold;cursor:pointer}
</style></head>
<body><div class="wrap">
  <div class="hd">🌳 绿太阳 · 在线客服<small>Adam(AI)实时接待 ｜ 输入「转人工」提交工单·48h回复</small></div>
  <div class="thanks">深沉感谢 阿里通义千问(Qwen) ｜ Anthropic Claude Code CLI</div>
  <div class="msgs" id="msgs"></div>
  <div class="ipt"><input id="ipt" placeholder="问 Adam，或输入「转人工」…" autocomplete="off"><button id="send">发送</button></div>
  <div class="form" id="form">
    <div style="font-size:13px;color:#8a5a00;font-weight:bold">📋 转人工工单（承诺48小时内人工回复）</div>
    <input id="fname" placeholder="怎么称呼你">
    <textarea id="fq" placeholder="请描述你的问题…" rows="3"></textarea>
    <button id="fsubmit">提交工单</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id),msgs=$('msgs'),history=[];
function add(who,text){const r=document.createElement('div');r.className='row '+who;
  const a=document.createElement('div');a.className='av '+who;a.textContent=who==='me'?'你':who==='sys'?'!':'A';
  const b=document.createElement('div');b.className='bub';b.textContent=text;r.append(a,b);msgs.append(r);msgs.scrollTop=msgs.scrollHeight;return b;}
add('adam','你好呀！我是 Adam，绿太阳的 AI 客服～可以先问我；需要真人帮忙就输入「转人工」，我帮你转工单。');
async function send(){
  const t=$('ipt').value.trim();if(!t)return;$('ipt').value='';add('me',t);
  if(t.replace(/\s/g,'')==='转人工'){
    add('sys','好的，正在为你转接人工客服。客服非7×24在线，请填写下面的工单，我们承诺 48 小时内人工回复 🙏');
    $('form').style.display='flex';$('fq').focus();return;
  }
  history.push({role:'user',content:t});$('send').disabled=true;const b=add('adam','…');
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({who:'Adam',text:t,history:history.slice(-8)})});
    const j=await r.json();const rep=j.reply||'(Adam没接上，可输入「转人工」找真人)';
    b.textContent=rep;history.push({role:'assistant',content:rep});
  }catch(e){b.textContent='(连接失败，可输入「转人工」找真人)';}
  $('send').disabled=false;$('ipt').focus();
}
$('send').onclick=send;$('ipt').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
$('fsubmit').onclick=async()=>{
  const name=$('fname').value.trim()||'访客',q=$('fq').value.trim();if(!q){alert('请填写问题');return;}
  $('fsubmit').disabled=true;
  try{const r=await fetch('/api/ticket',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({name,question:q})});const j=await r.json();
    if(j.ok){add('sys','✅ 工单已提交！工单号 '+j.id+'（请截图保存）。我们承诺 48 小时内人工回复。');
      $('form').style.display='none';$('fq').value='';}
    else add('sys',j.msg||'提交失败');
  }catch(e){add('sys','提交失败：'+e);}
  $('fsubmit').disabled=false;
};
</script></body></html>
